<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Socket.IO Demo</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
      }

      body {
        max-width: 760px;
        margin: 40px auto;
        padding: 0 20px;
        color: #1f2937;
        background: #f7f7f4;
      }

      h1,
      h2 {
        margin: 0 0 12px;
      }

      section {
        margin-top: 28px;
      }

      #messages,
      #events {
        min-height: 180px;
        max-height: 260px;
        overflow-y: auto;
        padding: 14px;
        border: 1px solid #c8c8bd;
        background: #ffffff;
      }

      .message,
      .event {
        margin-bottom: 8px;
        line-height: 1.4;
      }

      .meta {
        color: #667085;
        font-size: 0.9rem;
      }

      form {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      input,
      select,
      button {
        font: inherit;
        min-height: 38px;
      }

      input,
      select {
        flex: 1 1 180px;
        min-width: 0;
        padding: 8px 10px;
        border: 1px solid #b9b9ad;
        background: #ffffff;
      }

      button {
        padding: 8px 14px;
        border: 1px solid #1f2937;
        color: #ffffff;
        background: #1f2937;
        cursor: pointer;
      }

      button:hover {
        background: #374151;
      }
    </style>
  </head>

  <body>
    <h1>Socket.IO Chat Demo</h1>
    <p class="meta" id="connection-status">Connecting...</p>

    <section>
      <h2>Chat</h2>
      <div id="messages"></div>

      <form id="chat-form">
        <input id="chat-input" autocomplete="off" placeholder="Type a message..." />
        <button>Send</button>
      </form>
    </section>

    <section>
      <h2>Order Room</h2>
      <div id="events"></div>

      <form id="join-form">
        <input id="order-id" autocomplete="off" value="123" placeholder="Order ID" />
        <button>Join Order</button>
      </form>

      <form id="order-form">
        <input id="update-order-id" autocomplete="off" value="123" placeholder="Order ID" />
        <select id="order-status">
          <option value="placed">placed</option>
          <option value="allocated">allocated</option>
          <option value="packed">packed</option>
          <option value="shipped">shipped</option>
          <option value="delivered">delivered</option>
        </select>
        <button>Send Update</button>
      </form>
    </section>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();

      const connectionStatus = document.getElementById("connection-status");
      const chatForm = document.getElementById("chat-form");
      const chatInput = document.getElementById("chat-input");
      const messages = document.getElementById("messages");
      const joinForm = document.getElementById("join-form");
      const orderId = document.getElementById("order-id");
      const orderForm = document.getElementById("order-form");
      const updateOrderId = document.getElementById("update-order-id");
      const orderStatus = document.getElementById("order-status");
      const events = document.getElementById("events");

      function addMessage(text, metadata = "") {
        const item = document.createElement("div");
        item.className = "message";
        item.textContent = text;

        if (metadata) {
          const meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent = metadata;
          item.appendChild(meta);
        }

        messages.appendChild(item);
        messages.scrollTop = messages.scrollHeight;
      }

      function addEvent(text) {
        const item = document.createElement("div");
        item.className = "event";
        item.textContent = text;
        events.appendChild(item);
        events.scrollTop = events.scrollHeight;
      }

      socket.on("connect", () => {
        connectionStatus.textContent = `Connected as ${socket.id}`;
      });

      socket.on("disconnect", () => {
        connectionStatus.textContent = "Disconnected. Socket.IO will try to reconnect.";
      });

      socket.on("user:joined", (event) => {
        addEvent(`User joined: ${event.id}`);
      });

      chatForm.addEventListener("submit", (event) => {
        event.preventDefault();

        const text = chatInput.value.trim();
        if (!text) {
          return;
        }

        socket.emit("chat:message", { text }, (response) => {
          addEvent(`Chat acknowledgement: ${response.status}`);
        });

        chatInput.value = "";
      });

      socket.on("chat:message", (message) => {
        addMessage(`${message.id}: ${message.text}`, message.sentAt);
      });

      joinForm.addEventListener("submit", (event) => {
        event.preventDefault();

        socket.emit("order:join", orderId.value.trim(), (response) => {
          addEvent(`Joined ${response.roomId}`);
        });
      });

      socket.on("order:joined", (event) => {
        addEvent(`Server confirmed order room: ${event.roomId}`);
      });

      orderForm.addEventListener("submit", (event) => {
        event.preventDefault();

        socket.emit(
          "order:update",
          {
            orderId: updateOrderId.value.trim(),
            status: orderStatus.value
          },
          (response) => {
            addEvent(`Order update acknowledgement: ${response.status}`);
          }
        );
      });

      socket.on("order:updated", (event) => {
        addEvent(`Order ${event.orderId} changed to ${event.status} at ${event.updatedAt}`);
      });
    </script>
  </body>
</html>
