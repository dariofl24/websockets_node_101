<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Socket.IO Demo</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <h1>Socket.IO Chat Demo</h1>
    <p class="meta" id="connection-status">Connecting...</p>

    <section>
      <h2>Chat</h2>
      <div id="messages"></div>

      <form id="chat-form">
        <input id="chat-input" autocomplete="off" placeholder="Type a message..." />
        <button>Send</button>
      </form>
    </section>

    <section>
      <h2>Order Room</h2>
      <div id="events"></div>

      <form id="join-form">
        <input id="order-id" autocomplete="off" value="123" placeholder="Order ID" />
        <button>Join Order</button>
      </form>

      <form id="order-form">
        <input id="update-order-id" autocomplete="off" value="123" placeholder="Order ID" />
        <select id="order-status">
          <option value="placed">placed</option>
          <option value="allocated">allocated</option>
          <option value="packed">packed</option>
          <option value="shipped">shipped</option>
          <option value="delivered">delivered</option>
        </select>
        <button>Send Update</button>
      </form>
    </section>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
